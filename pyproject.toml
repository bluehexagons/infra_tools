[project]
name = "infra_tools"
version = "1.0.0"
description = "Automated setup scripts for remote Linux systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
completion = ["argcomplete>=3.0.0"]

[project.scripts]
infra_tools = "infra_tools:main"
webhook_manager = "web.service_tools.webhook_manager:main"

[tool.setuptools]
py-modules = ["infra_tools", "remote_setup"]
